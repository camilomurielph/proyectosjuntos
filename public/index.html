<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Compartidos</title>

  <!-- Iconos y manifest -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Comportamiento como app nativa en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compartidos">
  <meta name="theme-color" content="#1a0d2e">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-container">
      <h1>Compartidos</h1>
      <p>Inicia sesión con tu cuenta</p>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <div id="mainScreen" class="screen">
    <header>
      <h2 id="appTitle">Compartidos</h2>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </header>

    <!-- FILTROS -->
    <div id="filtersBar" style="display:none; padding: 0.5rem 1rem; background: #1e1e1e; border-bottom: 1px solid #333; gap: 0.5rem; flex-wrap: wrap;">
      <button id="filterRating" class="filter-btn active" data-sort="rating">⭐ Mejor puntuación</button>
      <button id="filterDistance" class="filter-btn" data-sort="distance">📍 Más cercano</button>
    </div>

    <main id="mainContent">
      <div id="itemsList"></div>
    </main>

    <nav id="bottomNav">
      <button class="tab-btn active" data-type="mudanza">🏠 Mudanza</button>
      <button class="tab-btn" data-type="restaurante">🍽️ Restaurantes</button>
      <button class="tab-btn" data-type="cita">💕 Citas</button>
      <button class="tab-btn" data-type="proyecto">🚀 Proyectos</button>
    </nav>

    <button id="fab" class="fab">+</button>
  </div>

  <!-- MODAL PARA TABLERO DE ITEM -->
  <div id="itemModal" class="modal">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modalTitle">Tablero</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </header>

      <!-- Edición del item padre -->
      <div class="item-header">
        <div class="item-title-area">
          <span id="viewTitle" class="item-title-text"></span>
          <button id="editTitleBtn" class="icon-btn">✏️</button>
        </div>
        <div class="item-title-edit" style="display:none;">
          <input type="text" id="editItemTitle" placeholder="Título">
          <button id="saveTitleBtn" class="save-btn small">Guardar</button>
          <button id="cancelTitleBtn" class="cancel-btn small">Cancelar</button>
        </div>
        <div class="item-desc-area">
          <span id="viewDesc" class="item-desc-text"></span>
          <button id="editDescBtn" class="icon-btn">✏️</button>
        </div>
        <div class="item-desc-edit" style="display:none;">
          <textarea id="editItemDesc" rows="2" placeholder="Descripción"></textarea>
          <button id="saveDescBtn" class="save-btn small">Guardar</button>
          <button id="cancelDescBtn" class="cancel-btn small">Cancelar</button>
        </div>
      </div>

      <!-- Puntuación con estrellas -->
      <div id="ratingArea" style="display:none; margin-bottom: 1rem;">
        <div style="font-weight: bold; color: #aaa; margin-bottom: 0.3rem;">Puntuaciones:</div>
        <div id="ratingsDisplay"></div>
        <div style="margin-top: 0.5rem;">
          <span style="font-weight: bold; color: #aaa;">Tu puntuación:</span>
          <span id="starsContainer" style="font-size: 1.8rem; cursor: pointer; margin-left: 0.5rem;">
            ☆☆☆☆☆
          </span>
          <span id="ratingInfo" style="font-size: 0.9rem; color: #888; margin-left: 0.5rem;"></span>
        </div>
      </div>

      <!-- Lista de subitems en grid -->
      <div id="subitemsList" class="subitems-grid"></div>

      <!-- Botones para añadir subitems -->
      <div class="add-subitem-buttons">
        <button id="addNoteBtn" class="sub-add-btn">📝 Nota</button>
        <button id="addLinkBtn" class="sub-add-btn">🔗 Enlace</button>
        <button id="addImageBtn" class="sub-add-btn">🖼️ Imagen</button>
        <button id="addLocationBtn" class="sub-add-btn" style="display:none;">📍 Ubicación</button>
      </div>

      <!-- Eliminar item -->
      <button id="deleteItemBtn" class="delete-btn full">Eliminar este item</button>
    </div>
  </div>

  <!-- MODAL PARA RECORTE DE IMAGEN -->
  <div id="cropModal" class="modal" style="align-items: center; background: rgba(0,0,0,0.9);">
    <div class="modal-content" style="max-height: 90vh; border-radius: 6px; background: #1e1e1e; width: 95%; max-width: 500px;">
      <header class="modal-header">
        <h3>Recortar imagen</h3>
        <button id="closeCropBtn" class="close-btn">&times;</button>
      </header>
      <div style="position: relative; width: 100%; display: flex; justify-content: center;">
        <canvas id="cropCanvas" style="max-width: 100%; max-height: 60vh; background: #000; border-radius: 6px;"></canvas>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-top: 0.8rem; justify-content: center;">
        <button id="cropConfirmBtn" class="save-btn">Recortar y subir</button>
        <button id="cropCancelBtn" class="cancel-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL PARA AÑADIR ENLACE (INDEPENDIENTE) -->
  <div id="linkModal" class="modal" style="align-items: center; background: rgba(0,0,0,0.8);">
    <div class="modal-content" style="max-height: 90vh; border-radius: 6px; background: #1e1e1e; width: 95%; max-width: 400px;">
      <header class="modal-header">
        <h3>Añadir enlace</h3>
        <button id="closeLinkModalBtn" class="close-btn">&times;</button>
      </header>
      <div style="display: flex; flex-direction: column; gap: 0.8rem;">
        <input type="url" id="linkUrlInput" placeholder="URL del enlace" style="width:100%; padding:0.5rem; background:#2a2a2a; color:#e0e0e0; border:1px solid #444; border-radius:6px;">
        <input type="text" id="linkNameInput" placeholder="Nombre del enlace (ej. Menú)" style="width:100%; padding:0.5rem; background:#2a2a2a; color:#e0e0e0; border:1px solid #444; border-radius:6px;">
        <div style="display:flex; gap:0.5rem; justify-content: flex-end;">
          <button id="linkCancelBtn" class="cancel-btn">Cancelar</button>
          <button id="linkConfirmBtn" class="save-btn">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PARA UBICACIÓN (CON AUTOCOMPLETADO ARCGIS) -->
  <div id="locationModal" class="modal" style="align-items: center; background: rgba(0,0,0,0.8);">
    <div class="modal-content" style="max-height: 90vh; border-radius: 6px; background: #1e1e1e; width: 95%; max-width: 400px; padding: 1.2rem 1.2rem 1.5rem;">
      <header class="modal-header">
        <h3>Agregar ubicación</h3>
        <button id="closeLocationModalBtn" class="close-btn">&times;</button>
      </header>
      <div style="display: flex; flex-direction: column; gap: 0.8rem;">
        <div style="position: relative;">
          <input type="text" id="locationInput" placeholder="Escribe una dirección..." style="width:100%; padding:0.5rem; background:#2a2a2a; color:#e0e0e0; border:1px solid #444; border-radius:6px;">
          <div id="suggestionsList" style="position: absolute; top: 100%; left: 0; right: 0; background: #2a2a2a; border: 1px solid #444; border-top: none; max-height: 250px; overflow-y: auto; display: none; z-index: 10; border-radius: 0 0 6px 6px;"></div>
        </div>
        <div style="display:flex; gap:0.5rem; justify-content: flex-end;">
          <button id="locationCancelBtn" class="cancel-btn">Cancelar</button>
          <button id="locationConfirmBtn" class="save-btn">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
